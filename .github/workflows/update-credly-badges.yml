name: Update Credly Badges
on:
  schedule:
    - cron: "0 2 * * *"  # 每天凌晨2点运行
  workflow_dispatch:     # 手动触发
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kpab/credly-readme@v1
        with:
          credly_user: erasxc159@163.com  # 你的 Credly 用户名
          sort: LATEST
          badge_width: 100
